name: Build & Deploy to GitHub Pages

# Deploys the static storefront. When Shopify secrets are present, the catalog
# is prerendered from the Storefront API first; otherwise the seeded
# data/products.json is used. A Shopify webhook can trigger this via
# repository_dispatch (type: shopify-sync) to rebuild when products change.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [shopify-sync]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prerender catalog from Shopify (skips if not configured)
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          PRODUCT_VENDOR: ${{ vars.PRODUCT_VENDOR }}
        run: node scripts/build-catalog.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
